name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # manual run from the Actions tab: builds and signs, but never publishes

permissions:
  contents: write

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The runner image already ships the Android SDK, but sdkmanager is not on PATH,
      # so locate it under $ANDROID_HOME and call it by full path.
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Linux dependency verification metadata
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --write-verification-metadata sha256 clean test :app:assembleRelease

      - name: Upload Linux verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: linux-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error

      - name: Verify dependencies and build release APK
        run: |
          ./gradlew --no-daemon clean test :app:assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/open-roulette-release.jks"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="$GITHUB_WORKSPACE/open-roulette-${GITHUB_REF_NAME}.apk"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          BUILD_TOOLS=${BUILD_TOOLS%/}
          echo "Using build-tools: $BUILD_TOOLS"

          test -n "$KEYSTORE_B64" -a -n "$KEYSTORE_PASSWORD" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD"
          test -f "$UNSIGNED_APK"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          # AGP already aligns the APK; fail loudly if it did not (do NOT rewrite it).
          "$BUILD_TOOLS/zipalign" -c -v 4 "$UNSIGNED_APK" > /dev/null

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"

          rm -f "$KEYSTORE_PATH"

      - name: Checksums
        run: sha256sum open-roulette-*.apk > SHA256SUMS

      # Manual (non-tag) runs: keep the signed APK as a run artifact only.
      - name: Upload build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            open-roulette-*.apk
            SHA256SUMS

      # Tag runs: publish a GitHub release (tags containing "-test" become prereleases).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *"-test"* ]]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" open-roulette-*.apk SHA256SUMS \
            --title "Open Roulette $GITHUB_REF_NAME" \
            --generate-notes $FLAGS