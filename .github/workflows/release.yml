name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and sign release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The runner image already has the Android SDK; just make sure the pieces we need exist.
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test :app:assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/open-roulette-release.jks"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="$GITHUB_WORKSPACE/open-roulette-${GITHUB_REF_NAME}.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -n "$KEYSTORE_B64" -a -n "$KEYSTORE_PASSWORD" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD"
          test -f "$UNSIGNED_APK"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

          # AGP already aligns the APK; fail loudly if not (do NOT rewrite it).
          "$BUILD_TOOLS/zipalign" -c -v 4 "$UNSIGNED_APK" > /dev/null

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"

          rm -f "$KEYSTORE_PATH"

      - name: Checksums
        run: sha256sum open-roulette-*.apk > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *"-test"* ]]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" open-roulette-*.apk SHA256SUMS \
            --title "Open Roulette $GITHUB_REF_NAME" \
            --generate-notes $FLAGS